name: Kosmara probe (temporal)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kosmara-probe.yml"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probar RPC publicos desde un origen de navegador
        run: |
          mkdir -p sdk
          O="Origin: https://cristiancgrd13-cpu.github.io"
          W="8AMfc11111111111111111111111111111111111111"
          {
            for u in "https://api.mainnet-beta.solana.com" "https://solana-rpc.publicnode.com" "https://solana.drpc.org" "https://rpc.ankr.com/solana" "https://solana.api.onfinality.io/public" "https://solana-mainnet.rpc.extrnode.com" "https://go.getblock.us/86aac42ad4484f3c813079afc201451c" "https://public.rpc.solanavibestation.com" "https://solana.leorpc.com/?api_key=FREE" "https://api.blockeden.xyz/solana/KeCh6p22EX5AeRHxMSmc" "https://solana.lavenderfive.com" "https://endpoints.omniatech.io/v1/sol/mainnet/public"; do
              echo "== $u"
              for m in '{"jsonrpc":"2.0","id":1,"method":"getSlot"}' '{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["So11111111111111111111111111111111111111112"]}' '{"jsonrpc":"2.0","id":1,"method":"getTokenAccountsByOwner","params":["5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1",{"programId":"TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"},{"encoding":"jsonParsed"}]}' '{"jsonrpc":"2.0","id":1,"method":"getMultipleAccounts","params":[["Czfq3xZZDmsdGdUyrNLtRhGc47cXcZtLG4crryfu44zE"],{"encoding":"base64"}]}' '{"jsonrpc":"2.0","id":1,"method":"getLatestBlockhash"}'; do
                curl -s -m 15 -o /tmp/b.json -D /tmp/h.txt -H "$O" -H "Content-Type: application/json" -d "$m" "$u" || true
                echo "$(echo "$m" | sed -E 's/.*"method":"([a-zA-Z]+)".*/\1/') | $(head -n 1 /tmp/h.txt | tr -d '\r') | acao=$(grep -i '^access-control-allow-origin' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2) | $(head -c 110 /tmp/b.json | tr '\n' ' ')"
                : > /tmp/b.json; : > /tmp/h.txt
              done
              curl -s -m 15 -o /dev/null -D /tmp/h.txt -X OPTIONS -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,solana-client" "$u" || true
              echo "preflight | $(head -n 1 /tmp/h.txt | tr -d '\r') | allow-headers=$(grep -i '^access-control-allow-headers' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2-)"
            done
          } > sdk/probe.txt 2>&1
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdk/probe.txt
          git commit -m "Sonda de RPC (temporal)" || exit 0
          git pull --rebase origin main
          git push
