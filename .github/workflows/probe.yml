name: probe
on: {push: {paths: [".github/workflows/probe.yml"]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          O="Origin: https://cristiancgrd13-cpu.github.io";V=0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045;SA=86xCnPeV69n6t3DnyGvkKobf9FdN2H9oiVDdaMpo2MMY
          echo LIBAL; curl -sS -m 40 -D h.txt -H "$O" "https://li.quest/v1/wallets/$V/balances?extended=true" -o l.json; head -1 h.txt; grep -i "access-control-allow-origin" h.txt
          python3 -c "
          import json;d=json.load(open('l.json'));print(type(d).__name__, list(d.keys())[:8] if isinstance(d,dict) else len(d))
          b=d.get('balances',d)
          if isinstance(b,dict):
            for k in list(b)[:6]: v=b[k];print(k,len(v),v[0] if v else '')
          " | cut -c1-600
          echo LIBALSOL; curl -sS -m 40 "https://li.quest/v1/wallets/$SA/balances?extended=true" | head -c 600; echo
          echo JUPH; for u in "https://lite-api.jup.ag/ultra/v1/holdings/$SA" "https://lite-api.jup.ag/ultra/v1/balances/$SA"; do curl -sS -m 20 -D h4.txt -H "$O" "$u" -o j.json; echo "$u $(head -1 h4.txt)"; head -c 500 j.json; echo; done
          echo BS; curl -sS -m 30 -H "$O" -D h3.txt "https://base.blockscout.com/api/v2/addresses/$V/token-balances" -o b.json; head -1 h3.txt; grep -i "access-control-allow-origin" h3.txt; head -c 500 b.json; echo
