name: probe
on: {push: {paths: [".github/workflows/probe.yml"]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          O="Origin: https://cristiancgrd13-cpu.github.io";K=aggregator-api.kyberswap.com;V=0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045;N=0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE
          echo OPT; curl -sS -X OPTIONS -D - -o /dev/null -H "$O" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-client-id" "https://$K/base/api/v1/routes" | grep -i "HTTP/\|access-control"
          for c in ethereum bsc base arbitrum avalanche hyperevm robinhood polygon optimism unichain monad sonic linea; do echo "$c $(curl -sS -m 15 -H "$O" -H 'x-client-id: kosmara' "https://$K/$c/api/v1/routes?tokenIn=$N&tokenOut=0x0000000000000000000000000000000000000001&amountIn=1000000000000000" | head -c 120)"; done
          echo ROUTE; curl -sS -D h.txt -H "$O" -H 'x-client-id: kosmara' "https://$K/base/api/v1/routes?tokenIn=$N&tokenOut=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913&amountIn=1000000000000000&feeAmount=30&isInBps=true&chargeFeeBy=currency_in&feeReceiver=$V" -o r.json; grep -i "access-control-allow-origin" h.txt
          python3 -c "
          import json;d=json.load(open('r.json'));print(d.get('code'),d.get('message'));s=d['data']['routeSummary'];print({k:s.get(k) for k in ['amountIn','amountOut','amountOutUsd','gasUsd','extraFee']});print(d['data'].get('routerAddress'))
          json.dump({'routeSummary':s,'sender':'$V','recipient':'$V','slippageTolerance':50},open('b.json','w'))"
          echo BUILD; curl -sS -D h2.txt -H "$O" -H 'x-client-id: kosmara' -H 'Content-Type: application/json' -X POST "https://$K/base/api/v1/route/build" -d @b.json -o o.json; grep -i "access-control-allow-origin" h2.txt; python3 -c "
          import json;d=json.load(open('o.json'));print(d.get('code'),d.get('message'));x=d.get('data',{});print({k:(str(v)[:60]) for k,v in x.items()})"
          echo OPT2; curl -sS -X OPTIONS -D - -o /dev/null -H "$O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-client-id" "https://$K/base/api/v1/route/build" | grep -i "HTTP/\|access-control"
