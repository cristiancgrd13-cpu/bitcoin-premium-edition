<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Personal</title>
    <script>tailwind = { config: { darkMode: 'class' } };</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .gauge-wrap { position: relative; width: 180px; height: 100px; margin: 0 auto; }
        .gauge-bg { width: 180px; height: 90px; border-radius: 90px 90px 0 0; background: conic-gradient(#ef4444 0deg 54deg,#f97316 54deg 90deg,#eab308 90deg 126deg,#84cc16 126deg 162deg,#22c55e 162deg 180deg); }
        .gauge-center { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 130px; height: 65px; background: #18181b; border-radius: 65px 65px 0 0; display: flex; align-items: center; justify-content: center; }
        .gauge-needle { position: absolute; bottom: 0; left: 50%; width: 3px; height: 72px; background: white; transform-origin: bottom center; border-radius: 3px 3px 0 0; transition: transform 1s ease; }
        .gauge-dot { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background: white; border-radius: 50%; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
        .modal-box { max-height: 85vh; overflow-y: auto; }
        .spinner { border: 3px solid #3f3f46; border-top-color: #f59e0b; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cat-select { background:#000; border:1px solid #52525b; border-radius:8px; font-size:11px; padding:3px 6px; color:#fff; }
    </style>
</head>
<body class="bg-black text-white min-h-screen p-4">
<div class="max-w-md w-full mx-auto text-center">

    <h1 class="text-3xl font-bold text-amber-400 mb-6">Portafolio Personal</h1>
