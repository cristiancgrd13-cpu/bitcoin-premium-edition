<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portafolio</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>window.Chart||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>')</script>
<script>window.Chart||document.write('<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"><\/script>')</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0d24;--line:rgba(255,255,255,.09);--coral:#ff7a59;--dim:#8a8a93}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#f3f3ff;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 88% -5%,rgba(255,122,89,.30),transparent),radial-gradient(720px 520px at -10% 35%,rgba(124,92,255,.32),transparent),radial-gradient(520px 420px at 60% 110%,rgba(45,212,191,.16),transparent)}
.d{font-family:'Bricolage Grotesque',sans-serif}
.g{display:grid;gap:1rem;max-width:1100px;margin:auto;padding:1.2rem}
.g>*{min-width:0}
@media(min-width:820px){.g{grid-template-columns:repeat(6,1fr)}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.all{grid-column:1/-1}}
.c{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:28px;padding:1.4rem;backdrop-filter:blur(16px);position:relative;overflow:hidden}
.k{font-size:.82rem;color:var(--dim);font-weight:500;margin-bottom:.9rem}
.dim{font-size:.75rem;color:var(--dim)}
.up{color:#22d68a;font-size:.78rem;font-weight:700}.dn{color:#ff5a5a;font-size:.78rem;font-weight:700}
.row{background:rgba(255,255,255,.045);border-radius:18px;padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.6rem}
.fx{display:flex;align-items:center;gap:.75rem}
.ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.2rem}
.btn{border-radius:999px;padding:.65rem 1.1rem;font:700 .85rem 'DM Sans';border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.p{background:linear-gradient(90deg,var(--coral),#ff5c8a);border:0}
.btn.r{background:rgba(255,90,110,.25)}
.lk{color:var(--coral);text-decoration:none}
