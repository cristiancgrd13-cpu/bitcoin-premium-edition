<style>
:root{--ink:#09090b;--line:rgba(255,255,255,.09);--coral:#f7931a;--bt:#f7931a;--dim:#8a8a93}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:#ececef;font-family:'JetBrains Mono',monospace;min-height:100vh}
body::before{display:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px 420px at var(--mx,50%) var(--my,50%),rgba(247,147,26,.10),transparent 70%);mix-blend-mode:screen;transition:opacity .4s}
.d,.hd h1{font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:-.03em}
.g{display:grid;gap:1rem;max-width:1100px;margin:auto;padding:1.2rem}
.g>*{min-width:0}
@media(min-width:820px){.g{grid-template-columns:repeat(6,1fr)}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.all{grid-column:1/-1}}
.c{background:rgba(15,15,18,.9);border:1px solid #2a2a30;border-top:2px solid var(--bt);border-radius:10px;background-image:linear-gradient(rgba(247,147,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(247,147,26,.035) 1px,transparent 1px);background-size:26px 26px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .5s}
.c:hover{box-shadow:0 0 0 1px rgba(247,147,26,.18),0 18px 50px -20px rgba(0,0,0,.7)}
.k{color:#c8c8cf;font-weight:700;font-size:.85rem;margin-bottom:.9rem}
.k::before{content:"> ";color:var(--bt);font-weight:800}
.dim{font-size:.75rem;color:var(--dim)}
.up{color:#22d68a;font-size:.78rem;font-weight:700}.dn{color:#ff5a5a;font-size:.78rem;font-weight:700}
.row{background:#16161a;border:1px solid #2a2a30;border-radius:6px;padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.6rem;transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s}
.fx{display:flex;align-items:center;gap:.75rem}
.ic{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;font-size:1.2rem;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.btn{border-radius:6px;padding:.65rem 1.1rem;font:700 .85rem 'JetBrains Mono',monospace;border:1px solid #34343c;background:#16161a;color:#ececef;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s}
.btn:hover{background:#202026}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--bt);color:#000;border:0}
.btn.r{background:#5a1f1f}
.lk{color:var(--bt);text-decoration:none}
.hero{min-height:360px;display:flex;flex-direction:column;justify-content:center}
.hero::after{content:"₿";position:absolute;right:-14px;bottom:-80px;font-size:310px;font-weight:800;color:rgba(247,147,26,.07);transform:rotate(14deg);pointer-events:none;z-index:0;line-height:1}
.big{font-size:clamp(2rem,8.5vw,4.2rem);font-weight:800;letter-spacing:-.05em;white-space:nowrap;font-variant-numeric:tabular-nums}
#total-value{color:#fff;text-shadow:0 0 34px rgba(247,147,26,.4)}
.big i{color:var(--bt);font-style:normal}
.perf{font-size:clamp(2.2rem,7vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.pe{font-size:1.5rem;font-weight:700;margin:.35rem 0 .8rem}
.chain{display:flex;flex-direction:column;gap:.4rem;margin-top:.9rem;font-size:.72rem;color:var(--dim)}
.chain span{white-space:nowrap}
.chain b{color:var(--bt);font-weight:700}
.hero>*{position:relative;z-index:1;pointer-events:none}
.hero>.spark{pointer-events:auto;height:58%;position:absolute!important;left:0;right:0;bottom:0;z-index:0!important;touch-action:pan-y}
.hero #blk a{pointer-events:auto}
#ath-box{margin-top:1rem;min-height:30px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.athl{color:var(--bt);font-weight:800;font-size:.95rem}
.athv{color:#fff;margin-left:.4rem}.athd{color:#8a8a93;font-weight:400;margin-left:.3rem}
.athl.one .athv,.athl.one .athd{margin-left:0}
#blk{padding:0 .3rem;border-radius:3px}#blk a{color:inherit;text-decoration:none}
.flash{animation:fl 1.8s ease-out}@keyframes fl{0%,45%{background:var(--bt);color:#000}100%{background:transparent}}
.tk{overflow:hidden;white-space:nowrap;border:1px solid #2a2a30;background:#0f0f12;border-radius:6px;padding:.6rem 0;font-size:.9rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tt{display:inline-block;white-space:nowrap;will-change:transform}
.ti{margin:0 1.4rem}
.ti b{color:var(--bt);font-size:1rem}
.ti em{font-style:normal;margin-left:.3rem}
.sep{color:var(--bt);font-size:.6rem;margin:0 .6rem}
.spwrap{margin-top:1.1rem;pointer-events:auto!important;touch-action:pan-y}
.sp-read{min-height:2.7rem;font-size:.85rem;line-height:1.35}
.sp-read .rv{color:var(--bt);font-weight:800;font-size:1.15rem;margin-left:.5rem}
.sp-cv{height:150px;margin-top:.3rem}
.rng{display:flex;justify-content:space-between;gap:.15rem;margin-top:.9rem}
.rng button{flex:1;background:none;border:0;color:#8a8a93;font:600 .82rem 'JetBrains Mono',monospace;padding:.55rem 0;border-radius:999px;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.rng button.on{background:#f2f2f5;color:#111}
.rng button:hover:not(.on){background:rgba(255,255,255,.07);color:#fff}
#assets-list .row{padding:1.05rem .9rem;position:relative;margin-bottom:1.15rem;border-left:3px solid var(--bt);display:flex;justify-content:space-between;gap:.5rem}
#assets-list .row>.fx{flex:1;min-width:0;gap:.55rem}
#assets-list .row>.fx>div{min-width:0}
#assets-list .row>.fx>div>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#assets-list .row>.fx>div>.dim{margin-top:.5rem;font-size:.75rem}
#assets-list .row>div:last-child{flex:none;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
#assets-list .ic{width:30px;height:30px;font-size:1rem;flex:none}
#assets-list .row b.d{font-size:.92rem}
#assets-list .dim{font-size:.72rem}
.cube{position:relative;height:84px;margin-bottom:.8rem;perspective:900px;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.cube:hover{transform:translateY(-3px)}
.cube:hover .ic{transform:rotate(-8deg) scale(1.08)}
.cube-in{position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(-42px);transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.cube.flip .cube-in{transform:translateZ(-42px) rotateX(90deg)}
#assets-list .cube .face{position:absolute;inset:0;margin:0;box-sizing:border-box;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:6px}
#assets-list .cube .front{transform:translateZ(42px);padding:.7rem .9rem;border:1px solid;border-left-width:3px;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
#assets-list .cube .back{transform:rotateX(-90deg) translateZ(42px);background:#16161a;border:1px solid;border-left-width:3px;padding:.7rem .9rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem;align-items:center;text-align:center}
.cube .a1,.cube .a2{display:flex;justify-content:space-between;align-items:baseline;gap:.2rem .6rem;flex-wrap:wrap}
.cube .a1>span,.cube .a2>span{white-space:nowrap}.cube .a1>b{margin-left:auto;white-space:nowrap;font-size:.95rem}
.cube .a2>span:last-child{margin-left:auto}
.cube .back .dim{font-size:.68rem}.cube .back .lk{font-size:.68rem;margin-left:.3rem}.cube .back .bp{font-size:1rem}
#assets-list .cube .wm{position:absolute;right:12px;top:50%;width:74px;height:74px;transform:translateY(-50%);opacity:.12;pointer-events:none;z-index:-1}
#assets-list .cube .wm svg{width:100%;height:100%;display:block}
#assets-list .cube .back .bk{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);width:30px;height:30px}
.bigcube{position:relative;height:130px;perspective:900px;cursor:pointer}
.bigcube .cube-in{transform:translateZ(-65px)}
.bigcube.flip .cube-in{transform:translateZ(-65px) rotateX(90deg)}
.bigcube .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bigcube .front{transform:translateZ(65px)}
.bigcube .back{transform:rotateX(-90deg) translateZ(65px)}
.bigcube.h2{height:206px}
.bigcube.h2 .cube-in{transform:translateZ(-103px)}
.bigcube.h2.flip .cube-in{transform:translateZ(-103px) rotateX(90deg)}
.bigcube.h2 .front{transform:translateZ(103px)}
.bigcube.h2 .back{transform:rotateX(-90deg) translateZ(103px)}
.lg{display:block;width:100%;height:100%}
.lg-t{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;margin-right:.1rem}
.prism{--ph:124px;--pa:35.8px;position:relative;height:var(--ph);perspective:700px}
.prism-in{--n:0;position:absolute;inset:0;transform-style:preserve-3d;transform:translateZ(calc(var(--pa)*-1)) rotateX(calc(var(--n)*120deg));transition:transform .9s cubic-bezier(.45,.05,.2,1)}
.pf{position:absolute;inset:0;display:flex;align-items:center;gap:.9rem;padding:0 1rem;box-sizing:border-box;border:1px solid;border-left-width:3px;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pf:nth-child(1){transform:translateZ(var(--pa))}
.pf:nth-child(2){transform:rotateX(-120deg) translateZ(var(--pa))}
.pf:nth-child(3){transform:rotateX(-240deg) translateZ(var(--pa))}
.pic{width:42px;height:42px;flex:none}.pic svg{width:100%;height:100%;display:block}
.ptx{display:flex;flex-direction:column;gap:.3rem;min-width:0}.ptx .dim{font-size:.75rem}
.pv{font-family:'JetBrains Mono',monospace;font-size:1.3rem;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:.4rem;margin-top:.8rem}
.dots i{width:6px;height:6px;border-radius:50%;background:#34343c;transition:all .3s}
.dots i.on{background:var(--bt);width:18px;border-radius:4px}
.gw{position:relative;width:200px;height:104px;margin:.5rem auto}
.gb{width:200px;height:100px;border-radius:100px 100px 0 0;background:conic-gradient(from 270deg at 50% 100%,#ef4444 0 36deg,#f97316 36deg 72deg,#eab308 72deg 108deg,#84cc16 108deg 144deg,#22c55e 144deg 180deg);-webkit-mask:radial-gradient(circle at 50% 100%,transparent 66px,#000 67px);mask:radial-gradient(circle at 50% 100%,transparent 66px,#000 67px)}
.gn{position:absolute;bottom:4px;left:50%;width:3px;height:86px;background:#fff;border-radius:3px;transform-origin:bottom center;transform:translateX(-50%) rotate(-90deg);transition:transform 1s ease}
.gv{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:1.8rem;font-weight:800}
.m{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem}
.m.h{display:none}
.mb{background:#0f0f12;border:1px solid #2a2a30;border-top:2px solid var(--bt);border-radius:10px;padding:1.4rem;width:100%;max-width:380px;max-height:88vh;overflow-y:auto}
.x{float:right;background:0;border:0;color:var(--dim);font-size:1.6rem;cursor:pointer;line-height:1;transition:transform .2s,color .2s}
.x:hover{color:#fff;transform:rotate(90deg)}
.i{width:100%;background:#16161a;border:1px solid #34343c;border-radius:6px;padding:.65rem .9rem;color:#fff;margin:.25rem 0 .8rem;outline:0;font:inherit;font-family:'JetBrains Mono',monospace;transition:border-color .2s,box-shadow .2s}
.i:focus{border-color:var(--bt);box-shadow:0 0 0 3px rgba(247,147,26,.15);outline:0}
.box{background:#16161a;border-radius:6px;padding:1rem;margin-bottom:.8rem}
.hd{display:flex;justify-content:space-between;align-items:baseline}
.hd h1{margin:0;font-size:1.7rem;letter-spacing:-.03em}
.hd .btn{white-space:nowrap;padding:.5rem .75rem;font-size:.78rem}
#manage-list .mcard{position:relative;isolation:isolate;height:84px;margin-bottom:.8rem;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.7rem .9rem;border:1px solid;border-left-width:3px;border-radius:6px;overflow:hidden;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
#manage-list .mcard:hover{transform:translateX(4px)}
#manage-list .mcard>.fx{flex:1;min-width:0;gap:.55rem}
#manage-list .mcard>.fx>div{min-width:0}
#manage-list .mcard>.fx>div>*{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#manage-list .mcard>.fx>div>.dim{margin-top:.5rem;font-size:.75rem}
#manage-list .mcard>div:last-child{flex:none;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:.5rem}
#manage-list .mcard .ic{width:30px;height:30px;flex:none}
#manage-list .mcard b.d{font-size:.92rem}
#manage-list .mcard .wm{position:absolute;right:12px;top:50%;width:74px;height:74px;transform:translateY(-50%);opacity:.12;pointer-events:none;z-index:-1}
.c.tint{background-image:linear-gradient(180deg,rgba(var(--tc),.26) 0%,rgba(var(--tc),.08) 45%,rgba(var(--tc),0) 78%),linear-gradient(rgba(var(--tc),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--tc),.04) 1px,transparent 1px);background-size:100% 100%,26px 26px,26px 26px;border-color:rgba(var(--tc),.38);border-top-color:rgb(var(--tc));box-shadow:0 0 26px rgba(var(--tc),.14);isolation:isolate;transition:border-color .6s,box-shadow .6s}
.c.tint:hover{box-shadow:0 0 0 1px rgba(var(--tc),.35),0 18px 60px -18px rgba(var(--tc),.25)}
.wmk{position:absolute;right:-24px;bottom:-30px;width:190px;height:190px;color:rgb(var(--tc));opacity:.09;transform:rotate(-12deg);pointer-events:none;z-index:-1}
.wmk svg{width:100%;height:100%;display:block}
.mb.tint{background-image:linear-gradient(180deg,rgba(var(--tc),.26) 0%,rgba(var(--tc),.08) 45%,rgba(var(--tc),0) 78%);border-color:rgba(var(--tc),.38);border-top-color:rgb(var(--tc));box-shadow:0 0 26px rgba(var(--tc),.14)}
.yr-btn-container{position:relative;height:28px;margin-top:.4rem}
.yr-btn{position:absolute;top:0;background:linear-gradient(180deg,rgba(45,212,191,.26) 0%,rgba(45,212,191,.08) 45%,rgba(45,212,191,0) 78%);border:1px solid rgba(45,212,191,.38);border-top-color:rgb(45,212,191);border-radius:6px;color:#ececef;font:inherit;font-size:.78rem;font-weight:700;padding:.2rem 0;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr-btn:hover{background:rgb(45,212,191);color:#000}
#avg-list{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#avg-list .row{margin:0}

/* Animación de scroll */
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.07s}.reveal.d2{transition-delay:.14s}.reveal.d3{transition-delay:.21s}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
</style>
</head>

<div id="spot" style="position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px 420px at var(--mx,50%) var(--my,50%),rgba(247,147,26,.10),transparent 70%);mix-blend-mode:screen;transition:opacity .4s"></div>
<style>
  .reveal { opacity: 0; transform: translateY(28px) scale(.985); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .cube { transition: transform .3s cubic-bezier(.34,1.56,.64,1) !important; }
  .cube:hover { transform: translateY(-3px); }
  .cube:hover .ic { transform: rotate(-8deg) scale(1.08) !important; }
  .btn { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .2s !important; }
  .btn:active { transform: scale(.96); }
  .rng button { transition: all .25s cubic-bezier(.34,1.56,.64,1) !important; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; } }
</style>
<script>
(function(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // 1. Luz que sigue al ratón
  const spot = document.getElementById('spot');
  let mx = innerWidth/2, my = innerHeight/2, tx = mx, ty = my;
  window.addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
  (function loop(){ mx += (tx-mx)*.08; my += (ty-my)*.08; spot.style.setProperty('--mx', mx+'px'); spot.style.setProperty('--my', my+'px'); requestAnimationFrame(loop); })();

  // 2. Animación de scroll
  const secs = [...document.querySelectorAll('main.g > *')];
  secs.forEach(s => s.classList.add('reveal'));
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: .08, rootMargin: '0px 0px -40px 0px' });
  secs.forEach(s => io.observe(s));
})();
</script>
