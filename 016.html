/* ====== CAPA DE VIDA / DINAMISMO ====== */
.reveal{opacity:0;transform:translateY(28px) scale(.985);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.07s}.reveal.d2{transition-delay:.14s}.reveal.d3{transition-delay:.21s}
.c{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .5s}
.c:hover{box-shadow:0 0 0 1px rgba(247,147,26,.18),0 18px 50px -20px rgba(0,0,0,.7)}
.c.tint:hover{box-shadow:0 0 0 1px rgba(var(--tc),.35),0 18px 60px -18px rgba(var(--tc),.25)}
#spot{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px 420px at var(--mx,50%) var(--my,50%),rgba(247,147,26,.10),transparent 70%);mix-blend-mode:screen;transition:opacity .4s}
.row,.mcard,.cube,.bigcube{transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,border-color .28s}
.cube:hover{transform:translateY(-2px)}
.cube:hover .front{box-shadow:inset 0 0 30px rgba(255,255,255,.04)}
.pf{transition:box-shadow .4s}
.prism:hover .pf{box-shadow:inset 0 0 40px rgba(255,255,255,.05)}
.pv{background:linear-gradient(90deg,#fff,#bdbdc7,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.big #total-value{background:linear-gradient(90deg,#fff,#ffd9b0,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 8s linear infinite}
.d.perf{transition:color .5s,text-shadow .5s}
.tk{border-radius:6px;box-shadow:inset 0 0 20px rgba(247,147,26,.05)}
.hd h1{position:relative;display:inline-block}
.hd h1::after{content:"";position:absolute;left:0;bottom:-6px;height:2px;width:0;background:linear-gradient(90deg,var(--bt),transparent);transition:width .6s ease}
.hd h1:hover::after{width:100%}
.rng button:hover:not(.on){background:rgba(255,255,255,.07);color:#fff}
.m{backdrop-filter:blur(4px)}
.gw .gn{box-shadow:0 0 12px rgba(255,255,255,.6)}
.c.tint::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.06) 48%,transparent 62%);background-size:250% 250%;opacity:0;transition:opacity .4s,background-position .9s}
.c.tint:hover::before{opacity:1;background-position:100% 100%}
.mcard:hover .ic,.cube:hover .ic{transform:rotate(-8deg) scale(1.08)}
.ic{transition:transform .3s cubic-bezier(.34,1.56,.64,1
