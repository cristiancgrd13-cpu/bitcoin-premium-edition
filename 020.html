<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kosmara: prototipo</title>
<style>
:root{--bg:#eef0f8;--card:#fff;--ink:#121433;--mut:#5f6288;--line:#dcdff0;--acc:#5b3fe0;--onacc:#fff;--field:#f5f6fc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b1e;--card:#13153a;--ink:#eceeff;--mut:#9ea2d0;--line:#262a5c;--acc:#8f7bff;--onacc:#0a0b1e;--field:#0d0f2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b1e;--card:#13153a;--ink:#eceeff;--mut:#9ea2d0;--line:#262a5c;--acc:#8f7bff;--onacc:#0a0b1e;--field:#0d0f2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:540px;margin:0 auto;padding:16px 16px 40px}
h1,.num{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:26px;letter-spacing:.01em}
.tag{font-size:13px;color:var(--mut);text-align:right;max-width:170px;line-height:1.3}
.sky{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:14px 0 8px;padding:6px 6px 14px;text-align:center}
.sky svg{width:100%;height:auto;display:block}
.sky .num{font-size:38px;line-height:1.1;margin-top:2px}
.sky .who{color:var(--mut);font-size:14px;margin:2px 10px 12px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
button{font:inherit;font-weight:600;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:10px 14px}
.btn.main{background:var(--acc);color:var(--onacc);border-color:var(--acc);width:100%;padding:14px;font-size:17px}
.msg{font-size:13px;color:var(--mut);margin:10px 14px 0;min-height:18px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0 4px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:12px 4px}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.tk{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk b{font-size:17px}.tk small{display:block;color:var(--mut)}
.tk .v{text-align:right}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
select,input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{margin:14px 0;padding:12px;border-radius:12px;background:var(--field);font-size:15px}
.out b{font-size:20px}
textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:150px;white-space:pre}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.empty{color:var(--mut);padding:8px 2px}
.foot{font-size:13px;color:var(--mut);margin-top:22px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Kosmara</h1><span class="tag">Prototipo con datos de demostración</span></header>

<section class="sky">
<svg id="sky" viewBox="0 0 360 220" role="img" aria-label="Tus redes como planetas, con tamaño según su valor"></svg>
<div class="num" id="tot">$0</div>
<div class="who" id="who">Sin wallet conectada</div>
<div class="row"><button class="btn" id="bPh">Conectar Phantom</button><button class="btn" id="bMm">Conectar MetaMask</button></div>
<div class="msg" id="msg"></div>
</section>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<p class="foot">Los saldos, precios y swaps son simulados. Nada se envía a ninguna blockchain. Las wallets solo se conectan si el navegador las detecta.</p>
</div>

<script>
var P={SOL:150,USDC:1,USDT:1,JUP:0.8,ORCA:3.2,BNB:600,CAKE:2.5,ETH:3000,UNI:8};
var CH={
 sol:{n:"Solana",c:"#19c3a5",a:-35,r:48,tk:{SOL:12.4,USDC:320,JUP:450,ORCA:60}},
 bnb:{n:"BNB Chain",c:"#f0b90b",a:95,r:76,tk:{BNB:3.2,USDT:410,CAKE:120}},
 eth:{n:"Ethereum",c:"#8a9bff",a:205,r:102,tk:{ETH:0.9,USDC:250,UNI:35}}
};
var S={ch:"sol",tab:"p",txs:[],from:"",to:"",amt:""};
var TABS=[["p","Cartera"],["s","Intercambiar"],["e","Exportar CSV"]];
function $(i){return document.getElementById(i)}
function f(n,d){return n.toLocaleString("es-ES",{maximumFractionDigits:d==null?2:d})}
function usd(n){return "$"+f(n,2)}
function val(c){var t=0;for(var k in CH[c].tk)t+=CH[c].tk[k]*P[k];return t}
function total(){return val("sol")+val("bnb")+val("eth")}
function short(a){return a.slice(0,5)+"…"+a.slice(-4)}
function msg(t){$("msg").textContent=t}

function sky(){
 var T=total(),h='<defs><radialGradient id="sun"><stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#ffb23e"/></radialGradient></defs>';
 for(var k in CH){h+='<circle cx="180" cy="110" r="'+CH[k].r+'" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-dasharray="2 5"/>'}
 h+='<circle cx="180" cy="110" r="10" fill="url(#sun)"/>';
 for(var k in CH){
  var c=CH[k],a=c.a*Math.PI/180,x=180+c.r*Math.cos(a),y=110+c.r*Math.sin(a),rad=8+16*val(k)/T,on=k===S.ch;
  h+='<g data-ch="'+k+'" style="cursor:pointer" tabindex="0" role="button" aria-label="'+c.n+'">';
  h+='<circle cx="'+x+'" cy="'+y+'" r="'+(rad+7)+'" fill="transparent"/>';
  if(on)h+='<circle cx="'+x+'" cy="'+y+'" r="'+(rad+5)+'" fill="none" stroke="'+c.c+'" stroke-width="2"/>';
  h+='<circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+c.c+'"/>';
  var ly=y+rad+15>212?y-rad-8:y+rad+14;
  h+='<text x="'+x+'" y="'+ly+'" text-anchor="middle" font-size="12" fill="currentColor" font-weight="'+(on?700:400)+'">'+c.n+'</text></g>';
 }
 $("sky").innerHTML=h;
 $("tot").textContent=usd(T);
}

function tabs(){
 $("tabs").innerHTML=TABS.map(function(t){return '<button class="tab'+(S.tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("");
}

function portfolio(){
 var c=CH[S.ch],rows=Object.keys(c.tk).map(function(k){
  return '<div class="tk"><div><b>'+k+'</b><small>'+usd(P[k])+' por unidad</small></div><div class="v"><b>'+usd(c.tk[k]*P[k])+'</b><small>'+f(c.tk[k],4)+' '+k+'</small></div></div>'}).join("");
 return '<div class="card"><b>'+c.n+'</b> <span style="color:var(--mut)">con '+usd(val(S.ch))+'</span>'+rows+'</div>';
}

function quote(){
 var a=parseFloat(S.amt),o=$("q");if(!o)return;
 if(!(a>0)){o.innerHTML="Introduce una cantidad para ver el cálculo.";return}
 var out=a*P[S.from]/P[S.to]*0.997;
 o.innerHTML="Recibirás unos <b>"+f(out,4)+" "+S.to+"</b><br><span style=\"color:var(--mut)\">Comisión simulada del 0,3% (≈ "+usd(a*P[S.from]*0.003)+")</span>";
}

function swap(){
 var c=CH[S.ch],ks=Object.keys(c.tk);
 if(!c.tk[S.from])S.from=ks[0];
 if(!c.tk[S.to]||S.to===S.from)S.to=ks.filter(function(k){return k!==S.from})[0];
 var opt=function(s){return ks.map(function(k){return '<option'+(k===s?" selected":"")+'>'+k+'</option>'}).join("")};
 return '<div class="card"><b>Intercambiar en '+c.n+'</b>'+
  '<div class="two"><div><label for="sf">Das</label><select id="sf">'+opt(S.from)+'</select></div><div><label for="st">Recibes</label><select id="st">'+opt(S.to)+'</select></div></div>'+
  '<label for="amt">Cantidad (saldo: '+f(c.tk[S.from],4)+' '+S.from+')</label><input id="amt" type="number" inputmode="decimal" min="0" step="any" value="'+S.amt+'" placeholder="0.0">'+
  '<div class="out" id="q"></div><button class="btn main" data-act="swap">Simular intercambio</button></div>';
}

function csv(){
 var L=["fecha,red,tipo,de,cantidad_entrada,a,cantidad_salida,comision_usd"];
 S.txs.forEach(function(t){L.push([t.d,t.ch,t.ty,t.fr,t.ai.toFixed(6),t.to,t.ao.toFixed(6),t.fee.toFixed(4)].join(","))});
 return L.join("\n");
}

function exp(){
 var rows=S.txs.map(function(t){return "<tr><td>"+t.d+"</td><td>"+t.ch+"</td><td>"+f(t.ai,4)+" "+t.fr+"</td><td>"+f(t.ao,4)+" "+t.to+"</td></tr>"}).join("");
 var tb=S.txs.length?'<div class="scroll"><table><tr><th>Fecha</th><th>Red</th><th>Das</th><th>Recibes</th></tr>'+rows+'</table></div>':'<div class="empty">Aún no hay movimientos. Haz un intercambio simulado y aparecerá aquí.</div>';
 return '<div class="card"><b>Movimientos ('+S.txs.length+')</b>'+tb+'</div>'+
  '<div class="card"><b>Archivo CSV</b><label for="csv">Cópialo y pégalo en una hoja de cálculo</label><textarea id="csv" readonly>'+csv()+'</textarea><div style="height:10px"></div><button class="btn main" data-act="copy">Copiar CSV</button></div>';
}

function view(){
 $("view").innerHTML=S.tab==="p"?portfolio():S.tab==="s"?swap():exp();
 if(S.tab==="s")quote();
}
function render(){sky();tabs();view()}

function doSwap(){
 var a=parseFloat(S.amt),c=CH[S.ch];
 if(!(a>0)){msg("Introduce una cantidad mayor que cero.");return}
 if(a>c.tk[S.from]){msg("No tienes saldo suficiente de "+S.from+".");return}
 var out=a*P[S.from]/P[S.to]*0.997;
 c.tk[S.from]-=a;c.tk[S.to]+=out;
 S.txs.unshift({d:new Date().toISOString().slice(0,16).replace("T"," "),ch:c.n,ty:"swap",fr:S.from,ai:a,to:S.to,ao:out,fee:a*P[S.from]*0.003});
 S.amt="";msg("Intercambio simulado: "+f(a,4)+" "+S.from+" a "+f(out,4)+" "+S.to+".");render();
}

function copyCsv(){
 var ta=$("csv"),ok=false;
 try{navigator.clipboard.writeText(ta.value);ok=true}catch(e){}
 if(!ok){try{ta.select();ok=document.execCommand("copy")}catch(e){}}
 msg(ok?"CSV copiado.":"No se pudo copiar solo: mantén pulsado el texto y elige copiar.");
}

document.addEventListener("click",function(e){
 var g=e.target.closest("[data-ch]"),t=e.target.closest("[data-tab]"),a=e.target.closest("[data-act]");
 if(g){S.ch=g.getAttribute("data-ch");S.from="";S.to="";S.amt="";render()}
 else if(t){S.tab=t.getAttribute("data-tab");msg("");render()}
 else if(a){a.getAttribute("data-act")==="swap"?doSwap():copyCsv()}
});
document.addEventListener("keydown",function(e){
 if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("data-ch")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
document.addEventListener("input",function(e){if(e.target.id==="amt"){S.amt=e.target.value;quote()}});
document.addEventListener("change",function(e){
 if(e.target.id==="sf"){S.from=e.target.value;S.amt="";view()}
 if(e.target.id==="st"){S.to=e.target.value;view()}
});

var FAIL="No se detectó la wallet. Abre esta página en un ordenador con la extensión o en el navegador interno de tu wallet.";
$("bPh").onclick=async function(){
 try{var p=window.phantom&&window.phantom.solana;if(!p)throw 0;
  var r=await p.connect();$("who").textContent="Phantom: "+short(r.publicKey.toString());msg("Conectada. Por ahora solo se muestra la dirección.");
 }catch(e){msg(FAIL)}
};
$("bMm").onclick=async function(){
 try{var w=window.ethereum;if(!w)throw 0;
  var a=(await w.request({method:"eth_requestAccounts"}))[0];
  var b=await w.request({method:"eth_getBalance",params:[a,"latest"]});
  $("who").textContent="MetaMask: "+short(a);msg("Conectada. Saldo de la moneda nativa de la red activa: "+f(parseInt(b,16)/1e18,4));
 }catch(e){msg(FAIL)}
};
render();
</script>
</body>
</html>
